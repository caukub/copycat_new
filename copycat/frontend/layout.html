<!DOCTYPE html>
<html lang="cs">
<meta charset="UTF-8">
<title>{% block title %}Paste | Hostify.cz{% endblock %}</title>
{% block head %}{% endblock %}
<meta name="viewport" content="width=device-width,initial-scale=1">
<noscript>
    <style>
        .nojs-hide {
            display: none !important;
        }
    </style>
</noscript>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style type="text/tailwindcss">
    @theme {
      --color-hostify-blue: oklch(62.94% 0.2024 255.43);
      --color-hostify-yellow: oklch(85.61% 0.1697 87.22);
      --color-hostify-red: oklch(59.45% 0.1994 20.78);
    }

    .i { color: var(--color-hostify-blue); }
    .w { color: var(--color-hostify-yellow); }
    .e { color: var(--color-hostify-red); }
    .c { color: green; }
  </style>
<link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
<body>    
    {% include "navbar.html" %}
    
    <main class="container mx-auto">
        {% block content %}{% endblock %}
    </main>
    
    {% include "footer.html" %}
    
    <style>
        main {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                Segoe UI,
                Roboto,
                Helvetica Neue,
                Arial,
                Noto Sans,
                Liberation Sans,
                sans-serif,
                'Apple Color Emoji',
                'Segoe UI Emoji',
                Segoe UI Symbol,
                'Noto Color Emoji';
    
            max-width: calc(100vw - 3%);
        }
    </style>
</body>
</html>
