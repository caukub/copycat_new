[package]
name = "copycat"
version = "0.1.0"
authors = ["caukub"]
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "copycat"

[dependencies]
askama = "0.15.1"
axum = { version = "0.8.8", features = ["multipart"] }
config = "0.15.19"
rand = "0.9.2"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.49.0", features = ["signal", "net", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
mclog = { version = "0.1.0", path = "../mclog" }
magika = { version = "1.0.0", features = ["_test"] }
futures-util = "0.3.31"
tokio-util = { version = "0.7.18", features = ["io"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
